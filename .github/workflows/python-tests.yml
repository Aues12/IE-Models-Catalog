name: Run Pytest Tests

on:
  push:
    branches: [ core ]
    tags: [ "v*" ]
  pull_request:
    branches: [ core ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff checks
        run: |
          ruff check .
          ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check release metadata
        run: python scripts/check_release.py

      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Restore the authoritative tag object if checkout materialized a commit ref.
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          python scripts/check_release.py --tag "$RELEASE_TAG"

      - name: Check agent contracts
        run: python scripts/sync_agent_metadata.py --check

      - name: Run Pytest
        run: pytest

  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Install and import the wheel
        run: |
          python -m pip install dist/*.whl
          cd /tmp
          python -c "from dynamic_models import DynamicLotSizing; from inventory_models import BasicEOQ; from ie_models_agent import run; assert run({'operation': 'list_models', 'params': {}})['success']"
          printf '%s' '{"operation":"list_models","params":{}}' | ie-models-agent
