[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ie-models-catalog"
version = "0.5.0"
description = "Inventory management models for industrial engineering."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["inventory", "eoq", "epq", "lot-sizing", "operations-research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "jsonschema>=4.18",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "plotly>=5.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "ruff>=0.16",
]

[project.urls]
Homepage = "https://github.com/Aues12/IE-Models-Catalog"
Repository = "https://github.com/Aues12/IE-Models-Catalog"
Issues = "https://github.com/Aues12/IE-Models-Catalog/issues"

[project.scripts]
ie-models-agent = "ie_models_agent.tool:main"

[tool.setuptools]
packages = ["ie_models_agent", "ie_models_agent.schemas"]
py-modules = ["inventory_models", "dynamic_models", "model_common"]

[tool.ruff]
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
ie_models_agent = ["contract.json", "schemas/*.json"]
